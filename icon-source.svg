<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9452"/>
      <stop offset="1" stop-color="#176536"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- left card -->
  <g transform="translate(140,300) rotate(-16)">
    <rect x="-62" y="-86" width="124" height="172" rx="18" fill="#fdf8ec" stroke="#e3d7b8" stroke-width="6"/>
    <circle cx="0" cy="-8" r="34" fill="#4a8fd6"/>
  </g>

  <!-- right card -->
  <g transform="translate(372,300) rotate(16)">
    <rect x="-62" y="-86" width="124" height="172" rx="18" fill="#fdf8ec" stroke="#e3d7b8" stroke-width="6"/>
    <circle cx="0" cy="-8" r="34" fill="#e0453f"/>
  </g>

  <!-- center card (matched pair, on top) -->
  <g transform="translate(256,296)">
    <rect x="-74" y="-102" width="148" height="204" rx="22" fill="#fff6da" stroke="#f2c14e" stroke-width="8"/>
    <circle cx="0" cy="-10" r="42" fill="#2fae5e"/>
  </g>

  <!-- crown badge, echoing the in-game "empty category slot" icon -->
  <g transform="translate(256,146)">
    <path d="M -58 18 L -58 -14 L -26 10 L 0 -40 L 26 10 L 58 -14 L 58 18 Z"
          fill="url(#gold)" stroke="#b6862a" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="-26" cy="-14" r="9" fill="url(#gold)" stroke="#b6862a" stroke-width="5"/>
    <circle cx="0" cy="-42" r="10" fill="url(#gold)" stroke="#b6862a" stroke-width="5"/>
    <circle cx="26" cy="-14" r="9" fill="url(#gold)" stroke="#b6862a" stroke-width="5"/>
  </g>
</svg>
