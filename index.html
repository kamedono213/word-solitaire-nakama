<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>なかまあつめソリティア</title>
<style>
  :root { color-scheme: light; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1d7a3f; touch-action:none; -webkit-user-select:none; user-select:none; font-family:-apple-system,system-ui,"Hiragino Maru Gothic ProN",sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#1d7a3f; z-index:10; padding:20px; box-sizing:border-box; text-align:center; }
  .screen[hidden] { display:none; }
  .screen h1 { font-size:1.5rem; margin:0; color:#fff; }
  .screen p { margin:0; color:#d8ecd8; font-size:.92rem; line-height:1.7; max-width:320px; }
  .bigbtn { border:0; padding:14px 32px; border-radius:999px; background:#f2c14e; color:#3a2a06; font-weight:800; font-size:1.05rem; box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .bigbtn:active { transform:scale(.97); }

  #topbar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:8px 14px 0; padding-top:calc(8px + env(safe-area-inset-top,0px)); }
  #coinWrap { display:flex; align-items:center; background:#17341f; border-radius:999px; padding:4px 14px 4px 4px; position:relative; }
  #coinIcon { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2c14e 60%,#c98f22); display:flex; align-items:center; justify-content:center; font-size:1.1rem; box-shadow:0 2px 4px rgba(0,0,0,.3); margin-right:8px; }
  #coinPlus { position:absolute; left:22px; top:22px; width:16px; height:16px; border-radius:50%; background:#2fae5e; color:#fff; font-size:.7rem; font-weight:900; display:flex; align-items:center; justify-content:center; border:2px solid #17341f; }
  #coinCount { color:#fff; font-weight:900; font-size:1rem; }
  #levelLabel { color:#fff; font-weight:800; font-size:1.15rem; }
  #menuIcon { color:#fff; font-size:1.4rem; line-height:1; }

  #subbar { flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; padding:10px 14px 4px; }
  #moveBanner {
    background:#2fae5e; color:#fff; font-weight:900; padding:8px 18px 14px; text-align:center;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 55% 78%, 50% 100%, 45% 78%, 0 78%);
    box-shadow:0 3px 6px rgba(0,0,0,.2);
  }
  #moveBanner .lbl { font-size:.62rem; opacity:.85; }
  #moveBanner .val { font-size:1.3rem; line-height:1.1; }
  #topPiles { display:flex; align-items:flex-start; gap:10px; }
  #stockWrap { position:relative; width:88px; height:118px; cursor:pointer; }
  .stockCard { position:absolute; inset:0; border-radius:10px; background:
    repeating-linear-gradient(45deg,#4a8fd6 0 8px,#5a9fe0 8px 16px); border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.25); }
  #stockBadge { position:absolute; top:-6px; right:-6px; background:#2d2d2d; color:#fff; font-size:.7rem; font-weight:800; border-radius:999px; padding:3px 7px; border:2px solid #fff; }

  /* ---- ウェイスト(山札からめくった置き場): 横に重ねて開く。手前(最新)が左、
     奥(先にめくった方)は右にずれて裏向きのスリバーだけ覗く ---- */
  #wasteWrap { position:relative; width:92px; height:118px; }
  #wasteWrap .card { position:absolute; width:76px; right:auto; top:0; }

  /* ---- 盤面: 上段4=カテゴリー置き場、下段4=ランダムに積まれたタブロー ---- */
  #board { flex:1; overflow-y:auto; padding:6px 10px 20px; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  .lane { display:flex; flex-direction:column; align-items:center; }
  .tab { background:#f2c14e; color:#3a2a06; font-size:.66rem; font-weight:900; border-radius:8px 8px 0 0; padding:3px 10px; margin-bottom:-2px; z-index:5; max-width:92%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; position:relative; }
  .tab[hidden] { display:none; }
  .stackWrap { position:relative; width:100%; max-width:84px; }

  .card {
    width:100%; aspect-ratio:3/4; border-radius:10px; background:#fdf8ec; box-shadow:0 3px 8px rgba(0,0,0,.2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-weight:800; color:#3a2e1f;
    font-size:.84rem; line-height:1.2; padding:5px; box-sizing:border-box; border:2px solid #e3d7b8; position:absolute; left:0; right:0; top:0;
  }
  .card.pile { border-color:#f2c14e; border-width:3px; box-shadow:0 4px 12px rgba(242,193,78,.4); }
  .card.header { background:#fff6da; border-color:#f2c14e; border-style:dashed; }
  .card.empty-slot { background:transparent; border:2px dashed rgba(255,255,255,.35); box-shadow:none; }
  .card.facedown { background:repeating-linear-gradient(45deg,#4a8fd6 0 7px,#5a9fe0 7px 14px); border-color:#fff; }
  .card .crown { font-size:1.15rem; margin-bottom:2px; opacity:.55; }
  .card .frac { font-size:.64rem; color:#a98a2e; font-weight:900; margin-top:3px; }
  .card .htag { font-size:.6rem; color:#b6902c; font-weight:900; margin-bottom:2px; }
  .bundleBadge { position:absolute; top:-7px; right:-7px; background:#e0453f; color:#fff; font-size:.62rem; font-weight:900; border-radius:999px; padding:2px 6px; border:2px solid #fff; }
  .card.active { cursor:grab; }
  .card.buried { pointer-events:none; }
  .card.dragging { position:fixed !important; z-index:80; box-shadow:0 12px 28px rgba(0,0,0,.35); cursor:grabbing; }
  .lane.hot .card.active, .lane.hot .card.empty-slot { outline:3px solid #fff; outline-offset:2px; }
  .card.wrong { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #toast { position:fixed; left:50%; top:16%; transform:translate(-50%,-50%) scale(.9); background:#2d2d2d; color:#fff; padding:10px 20px; border-radius:999px; font-size:.85rem; font-weight:700; z-index:90; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #bottomBar { flex:0 0 auto; display:flex; justify-content:center; gap:26px; padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px)); }
  .toolbtn { position:relative; width:54px; height:54px; border-radius:16px; border:0; display:flex; align-items:center; justify-content:center; font-size:1.4rem; box-shadow:0 3px 8px rgba(0,0,0,.25); }
  .toolbtn:active { transform:scale(.94); }
  #hintBtn { background:#4a8fd6; }
  #undoBtn { background:#f4f4f4; }
  #shuffleBtn { background:#f2c14e; }
  .toolbtn .badge { position:absolute; top:-6px; right:-6px; background:#e0453f; color:#fff; font-size:.65rem; font-weight:800; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid #fff; }

  .confetti { position:fixed; top:-10px; width:8px; height:8px; border-radius:2px; z-index:95; }
</style>
</head>
<body>
<div id="app">

  <div id="titleScreen" class="screen">
    <h1>なかまあつめソリティア</h1>
    <p>上の4つの王冠マークは、まだ見つかってない仲間の置き場。下の山を掘って「カテゴリーカード」を見つけたら王冠の場所にドラッグ。その仲間に合う単語カードを、できた山にドラッグして集めよう。</p>
    <button class="bigbtn" id="startBtn">はじめる</button>
  </div>

  <div id="clearScreen" class="screen" hidden>
    <h1>🎉 クリア！</h1>
    <p id="clearStats"></p>
    <button class="bigbtn" id="retryBtn">もう一度あそぶ</button>
  </div>

  <div id="gameScreen" hidden style="display:flex; flex-direction:column; height:100%;">
    <div id="topbar">
      <div id="coinWrap"><div id="coinIcon">🪙</div><div id="coinPlus">+</div><div id="coinCount">0</div></div>
      <div id="levelLabel">なかまあつめ</div>
      <div id="menuIcon">☰</div>
    </div>
    <div id="subbar">
      <div id="moveBanner"><div class="lbl">手数</div><div class="val" id="moveCount">0</div></div>
      <div style="flex:1"></div>
      <div id="topPiles">
        <div id="wasteWrap"></div>
        <div id="stockWrap"><div class="stockCard"></div><div id="stockBadge">0</div></div>
      </div>
    </div>
    <div id="board">
      <div class="row" id="rowTop"></div>
      <div class="row" id="rowBottom"></div>
    </div>
    <div id="bottomBar">
      <button class="toolbtn" id="hintBtn">💡<span class="badge" id="hintBadge">3</span></button>
      <button class="toolbtn" id="undoBtn">↩️<span class="badge" id="undoBadge">3</span></button>
      <button class="toolbtn" id="shuffleBtn">🔀<span class="badge" id="shuffleBadge">1</span></button>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const CATEGORY_DEFS = [
    { label: 'どうぶつ', words: ['イヌ','ネコ','ゾウ','キリン'] },
    { label: 'くだもの', words: ['リンゴ','バナナ','イチゴ','ブドウ'] },
    { label: 'スポーツ', words: ['サッカー','やきゅう','すいえい','テニス'] },
    { label: 'てんき',   words: ['はれ','あめ','くもり','ゆき'] },
    { label: 'のりもの', words: ['でんしゃ','ひこうき','ふね','バス'] },
    { label: 'いろ',     words: ['あか','あお','きいろ','みどり'] },
  ];
  const TOP_LANES = 4, BOTTOM_LANES = 4, LANES = TOP_LANES + BOTTOM_LANES;
  const STOCK_RESERVE = 10; // 初期配置せず控えに残しておく枚数

  // lane: { isTableau, stack:[{type,catIndex,word?,label?}, ...](index0=手前/操作可能), pile:null|{catIndex,collected,target,label,faceWord} }
  let lanes = [];
  let stock = [];
  let moves = 0, totalWordCards = 0, placedWordCards = 0, coins = 0;
  let hints = 3, undos = 3, shuffles = 3;
  let history = [];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck() {
    const deck = [];
    CATEGORY_DEFS.forEach((cat, ci) => {
      deck.push({ type: 'header', catIndex: ci, label: cat.label });
      cat.words.forEach((w) => deck.push({ type: 'word', catIndex: ci, word: w }));
    });
    return shuffle(deck);
  }

  let waste = []; // 山札からめくったカード(末尾=手前/操作可能、他は埋もれて不可)

  function setupGame() {
    const deck = buildDeck();
    totalWordCards = deck.filter((c) => c.type === 'word').length;
    placedWordCards = 0;
    moves = 0; coins = 0;
    hints = 3; undos = 3; shuffles = 3;
    history = [];
    waste = [];

    lanes = [];
    for (let i = 0; i < TOP_LANES; i++) lanes.push({ isTableau: false, stack: [], pile: null });

    const dealCount = deck.length - STOCK_RESERVE;
    const tableauDeal = deck.slice(0, dealCount);
    stock = deck.slice(dealCount);

    const bottom = Array.from({ length: BOTTOM_LANES }, () => ({ isTableau: true, stack: [], pile: null }));
    tableauDeal.forEach((card, i) => { bottom[i % BOTTOM_LANES].stack.push(card); });
    lanes.push(...bottom);

    updateHud();
  }

  function snapshot() { return JSON.parse(JSON.stringify({ lanes, stock, waste, moves, placedWordCards })); }
  function pushHistory() { history.push(snapshot()); if (history.length > 20) history.shift(); }

  // 山札タップ: 1枚だけ表向きにめくってウェイスト(手前)に積む。
  // 後からめくった方が手前になり、先にめくった方はその下に埋もれて使えなくなる。
  function tapStock() {
    if (!stock.length) { showToast('山札切れ'); return; }
    pushHistory();
    waste.push(stock.pop());
    updateStockBadge();
    renderWaste();
  }

  function updateHud() {
    $('moveCount').textContent = moves;
    $('coinCount').textContent = coins;
    updateStockBadge();
    $('hintBadge').textContent = hints;
    $('undoBadge').textContent = undos;
    $('shuffleBadge').textContent = shuffles;
    $('hintBtn').style.opacity = hints > 0 ? 1 : .4;
    $('undoBtn').style.opacity = undos > 0 ? 1 : .4;
    $('shuffleBtn').style.opacity = shuffles > 0 ? 1 : .4;
  }
  function updateStockBadge() { $('stockBadge').textContent = stock.length; }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 700);
  }

  // ---- 描画 ----
  function renderBoard() {
    const rowTop = $('rowTop'); const rowBottom = $('rowBottom');
    rowTop.innerHTML = ''; rowBottom.innerHTML = '';
    lanes.forEach((lane, li) => {
      const laneEl = document.createElement('div');
      laneEl.className = 'lane';
      laneEl.id = 'lane-' + li;

      const tab = document.createElement('div');
      tab.className = 'tab';
      if (lane.pile) tab.textContent = lane.pile.label; else tab.hidden = true;
      laneEl.appendChild(tab);

      const wrap = document.createElement('div');
      wrap.className = 'stackWrap';
      wrap.id = 'stack-' + li;
      laneEl.appendChild(wrap);

      (li < TOP_LANES ? rowTop : rowBottom).appendChild(laneEl);
      renderLaneStack(li);
    });
  }

  const PEEK_OFFSET = 15; // カード1枚ごとに下へずらす量(px)
  const MAX_PEEK = 5;     // これ以上奥は同じ位置に重ねて省略

  function renderLaneStack(li) {
    const lane = lanes[li];
    const wrap = $('stack-' + li);
    wrap.innerHTML = '';

    if (lane.pile) {
      wrap.style.height = '';
      const card = document.createElement('div');
      card.className = 'card pile active';
      card.style.position = 'relative';
      card.innerHTML = `<div class="crown">👑</div><div>${escapeHtml(lane.pile.faceWord)}</div><div class="frac">${lane.pile.collected}/${lane.pile.target}</div>`;
      wireDrag(card, li);
      wrap.appendChild(card);
      return;
    }

    if (!lane.stack.length) {
      wrap.style.height = '';
      const empty = document.createElement('div');
      empty.className = 'card empty-slot';
      empty.style.position = 'relative';
      empty.innerHTML = `<div class="crown">👑</div>`;
      wrap.appendChild(empty);
      return;
    }

    // stack[0]が手前(一番操作できる・表向き)。奥のカード(idx大)ほど裏向きで
    // 上側に控えめにずらして重ねる(元レイアウト通り、手前が下・奥が上)。
    const depth = Math.min(lane.stack.length, MAX_PEEK + 1);
    const cardAspectHeight = wrap.getBoundingClientRect().width / 3 * 4;
    wrap.style.height = (cardAspectHeight + (depth - 1) * PEEK_OFFSET) + 'px';

    for (let idx = depth - 1; idx >= 0; idx--) {
      const c = lane.stack[idx];
      const el = document.createElement('div');
      const isHeader = c.type === 'header';
      const isFront = idx === 0;
      el.className = 'card' + (isFront ? ' active' : ' buried facedown') + (isFront && isHeader ? ' header' : '');
      el.style.top = ((depth - 1 - idx) * PEEK_OFFSET) + 'px';
      el.style.zIndex = String(100 - idx);
      if (!isFront) {
        // 裏向き: 中身は見せない
      } else if (isHeader) {
        el.innerHTML = `<div class="htag">カテゴリー</div><div>${escapeHtml(c.label)}</div>`;
      } else {
        el.textContent = c.word;
        const runLen = frontRunLength(li);
        if (runLen > 1) {
          const badge = document.createElement('div');
          badge.className = 'bundleBadge';
          badge.textContent = '×' + runLen;
          el.appendChild(badge);
        }
      }
      if (isFront) wireDrag(el, li);
      wrap.appendChild(el);
    }
  }

  const WASTE_PEEK_H_OFFSET = 14; // ウェイストは縦ではなく横にずらして重ねる(元レイアウト通り)
  function renderWaste() {
    const wrap = $('wasteWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (!waste.length) return;
    const depth = Math.min(waste.length, 2); // 手前+1枚分の裏向きスリバーだけ見せる
    // 奥(先にめくった方)を右にずらして裏向きで置き、手前(最新)を左に重ねて表向きで出す。
    for (let back = depth - 1; back >= 0; back--) {
      const idx = waste.length - 1 - back; // 0 = 手前
      const c = waste[idx];
      const el = document.createElement('div');
      const isFront = back === 0;
      const isHeader = c.type === 'header';
      el.className = 'card' + (isFront ? ' active' : ' buried facedown') + (isFront && isHeader ? ' header' : '');
      el.style.left = (back * WASTE_PEEK_H_OFFSET) + 'px';
      el.style.top = '0';
      el.style.zIndex = String(100 - back);
      if (!isFront) {
        // 裏向き
      } else if (isHeader) {
        el.innerHTML = `<div class="htag">カテゴリー</div><div>${escapeHtml(c.label)}</div>`;
      } else {
        el.textContent = c.word;
      }
      if (isFront) wireDrag(el, 'waste');
      wrap.appendChild(el);
    }
  }

  // ---- ドラッグ&ドロップ ----
  function wireDrag(el, laneIdx) {
    let startX, startY, origLeft, origTop, dragging = false;

    function onDown(e) {
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
      const rect = el.getBoundingClientRect();
      origLeft = rect.left; origTop = rect.top;
      dragging = true;
      el.classList.add('dragging');
      el.style.width = rect.width + 'px';
      el.style.height = rect.height + 'px';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    }
    function onMove(e) {
      if (!dragging) return;
      if (e.cancelable) e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - startX, dy = pt.clientY - startY;
      el.style.left = (origLeft + dx) + 'px';
      el.style.top = (origTop + dy) + 'px';
      const hovered = laneUnderPoint(pt.clientX, pt.clientY);
      document.querySelectorAll('.lane').forEach((l) => l.classList.remove('hot'));
      if (hovered !== null && hovered !== laneIdx) $('lane-' + hovered).classList.add('hot');
    }
    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      document.querySelectorAll('.lane').forEach((l) => l.classList.remove('hot'));
      const pt = e.changedTouches ? e.changedTouches[0] : e;
      const targetLane = laneUnderPoint(pt.clientX, pt.clientY);
      el.classList.remove('dragging');
      el.style.position = ''; el.style.width = ''; el.style.height = ''; el.style.left = ''; el.style.top = '';
      if (targetLane !== null && targetLane !== laneIdx) {
        attemptMove(laneIdx, targetLane);
      } else {
        renderSource(laneIdx);
      }
    }
    el.addEventListener('mousedown', onDown);
    el.addEventListener('touchstart', onDown, { passive: true });
  }

  function laneUnderPoint(x, y) {
    for (let i = 0; i < LANES; i++) {
      const el = $('lane-' + i);
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
    }
    return null;
  }

  // fromLaneは通常のレーン番号(0-7)か、特別な識別子 'waste'(山札からめくった
  // ウェイスト置き場)のどちらか。ウェイストは配列の末尾が手前(操作可能)。
  function frontCardOf(loc) {
    if (loc === 'waste') return waste.length ? waste[waste.length - 1] : null;
    const lane = lanes[loc];
    return lane.stack.length ? lane.stack[0] : null;
  }

  // 手前から同じ仲間(単語カードのみ)が何枚連続で重なっているか。
  // これが「束ね移動」でまとめて動かせる枚数になる。カテゴリーカードは束ねない。
  function frontRunLength(loc) {
    if (loc === 'waste') {
      if (!waste.length || waste[waste.length - 1].type !== 'word') return waste.length ? 1 : 0;
      const cat = waste[waste.length - 1].catIndex;
      let n = 0;
      for (let i = waste.length - 1; i >= 0 && waste[i].type === 'word' && waste[i].catIndex === cat; i--) n++;
      return n;
    }
    const stack = lanes[loc].stack;
    if (!stack.length || stack[0].type !== 'word') return stack.length ? 1 : 0;
    const cat = stack[0].catIndex;
    let n = 0;
    while (n < stack.length && stack[n].type === 'word' && stack[n].catIndex === cat) n++;
    return n;
  }

  // 手前からcount枚を取り除いて返す(レーンの先頭側/ウェイストの末尾側)。
  function consumeFront(loc, count) {
    if (loc === 'waste') return waste.splice(waste.length - count, count).reverse();
    return lanes[loc].stack.splice(0, count);
  }

  function renderSource(loc) {
    if (loc === 'waste') renderWaste(); else renderLaneStack(loc);
  }

  // カテゴリーカード→空き枠(0枚かつ未確定のレーン)で新しい山を作る。
  // 単語カード(手前に同じ仲間が連続してれば束ねて)→既にできてる同じ仲間の山に重ねて
  // 納品するか、別のタブロー列の同じ仲間の束に合体させて束を育てる。
  function attemptMove(fromLane, toLane) {
    const card = frontCardOf(fromLane);
    const target = lanes[toLane];
    if (!card) return;

    moves++;

    if (card.type === 'header') {
      const ok = !target.pile && target.stack.length === 0;
      if (ok) {
        pushHistory();
        consumeFront(fromLane, 1);
        target.pile = { catIndex: card.catIndex, collected: 0, target: CATEGORY_DEFS[card.catIndex].words.length, label: card.label, faceWord: '?' };
      } else {
        rejectMove(fromLane, toLane, '空いてる枠にしか置けないよ');
        return;
      }
      afterSuccessfulMove(fromLane, toLane, target);
      return;
    }

    // 単語カード(束)の移動
    const runLen = frontRunLength(fromLane);
    let depositedCount = 0;

    if (target.pile && target.pile.catIndex === card.catIndex) {
      const space = target.pile.target - target.pile.collected;
      depositedCount = Math.min(runLen, space);
      if (depositedCount > 0) {
        pushHistory();
        const moved = consumeFront(fromLane, depositedCount);
        target.pile.collected += depositedCount;
        target.pile.faceWord = moved[moved.length - 1].word;
        placedWordCards += depositedCount;
      }
    } else if (!target.pile && target.isTableau && target.stack.length && target.stack[0].type === 'word' && target.stack[0].catIndex === card.catIndex) {
      pushHistory();
      const moved = consumeFront(fromLane, runLen);
      target.stack.unshift(...moved);
      depositedCount = runLen; // 合体成功(消費はしてないが「成功」扱い)
    }

    if (depositedCount <= 0) {
      rejectMove(fromLane, toLane, 'ちがう仲間みたい…');
      return;
    }
    afterSuccessfulMove(fromLane, toLane, target);
  }

  function rejectMove(fromLane, toLane, msg) {
    play(false);
    showToast(msg);
    updateHud();
    renderSource(fromLane);
    const toEl = $('stack-' + toLane).querySelector('.card.active, .card.empty-slot');
    if (toEl) { toEl.classList.add('wrong'); setTimeout(() => toEl.classList.remove('wrong'), 320); }
  }

  function afterSuccessfulMove(fromLane, toLane, target) {
    play(true);

    if (target.pile && target.pile.collected >= target.pile.target) {
      const label = target.pile.label;
      coins += 10;
      showToast(`「${label}」コンプリート！+10コイン`);
      updateHud();
      setTimeout(() => {
        target.pile = null;
        renderBoard();
      }, 650);
    }

    updateHud();
    renderBoard();
    if (fromLane === 'waste') renderWaste();

    if (placedWordCards >= totalWordCards) setTimeout(showClear, 500);
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ---- ツール ----
  $('hintBtn').addEventListener('click', () => {
    if (hints <= 0) return;
    const sources = [...Array(LANES).keys(), 'waste'];
    // まず「空き枠にドラッグできるカテゴリーカード」を探し、無ければ「山に重ねられる単語カード」を探す。
    for (const i of sources) {
      const c = frontCardOf(i);
      if (c && c.type === 'header') {
        const emptyIdx = lanes.findIndex((l) => !l.pile && l.stack.length === 0);
        if (emptyIdx !== -1) { flashHint([i, emptyIdx]); hints--; updateHud(); return; }
      }
    }
    for (const i of sources) {
      const c = frontCardOf(i);
      if (c && c.type === 'word') {
        const pileIdx = lanes.findIndex((l) => l.pile && l.pile.catIndex === c.catIndex);
        if (pileIdx !== -1) { flashHint([i, pileIdx]); hints--; updateHud(); return; }
      }
    }
    showToast('今すぐ置ける組み合わせが盤面にないみたい');
  });
  function flashHint(idxs) {
    idxs.forEach((li) => {
      const wrap = li === 'waste' ? $('wasteWrap') : $('stack-' + li);
      const c = wrap && wrap.querySelector('.card.active, .card.empty-slot');
      if (c) { c.style.outline = '3px solid #ffe08a'; setTimeout(() => { c.style.outline = ''; }, 1200); }
    });
  }

  $('undoBtn').addEventListener('click', () => {
    if (undos <= 0 || !history.length) return;
    undos--;
    const snap = history.pop();
    lanes = snap.lanes; stock = snap.stock; waste = snap.waste; moves = snap.moves; placedWordCards = snap.placedWordCards;
    updateHud();
    renderBoard();
    renderWaste();
  });

  $('shuffleBtn').addEventListener('click', () => {
    if (shuffles <= 0) return;
    shuffles--;
    const movable = [];
    lanes.forEach((lane, i) => { if (!lane.pile && lane.stack.length) movable.push(i); });
    const cards = shuffle(movable.map((i) => lanes[i].stack[0]));
    movable.forEach((i, idx) => { lanes[i].stack[0] = cards[idx]; });
    updateHud();
    renderBoard();
    showToast('シャッフルした！');
  });

  // ---- 効果音 ----
  let actx;
  function tone(freq, dur, opts = {}) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + (opts.delay || 0);
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, t0 + dur);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(opts.vol || 0.18, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function play(correct) {
    if (correct) { tone(520, 0.12, { type: 'triangle' }); tone(760, 0.16, { type: 'triangle', delay: 0.07, vol: 0.14 }); }
    else { tone(180, 0.18, { type: 'sine', slideTo: 120, vol: 0.14 }); }
  }

  function spawnConfetti() {
    const colors = ['#f2c14e','#2fae5e','#4a8fd6','#e0453f'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animation = `fall ${1.2 + Math.random() * 1.2}s linear forwards`;
      el.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  }
  const styleTag = document.createElement('style');
  styleTag.textContent = `@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity:.3; } }`;
  document.head.appendChild(styleTag);

  function showClear() {
    $('gameScreen').hidden = true;
    $('clearStats').textContent = `手数 ${moves}回で、ぜんぶの仲間を見つけられました！`;
    $('clearScreen').hidden = false;
    spawnConfetti();
    tone(660, 0.15, { type: 'triangle' });
    tone(880, 0.2, { type: 'triangle', delay: 0.12 });
    tone(1100, 0.25, { type: 'triangle', delay: 0.24 });
  }

  function startGame() {
    setupGame();
    $('titleScreen').hidden = true;
    $('clearScreen').hidden = true;
    $('gameScreen').hidden = false;
    renderBoard();
    renderWaste();
  }

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('stockWrap').addEventListener('click', tapStock);
})();
</script>
</body>
</html>
